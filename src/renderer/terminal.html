    <script data-page-node-id="hf6mLANFasB4qRIJczeiYm" src="vendor/xterm.js"></script>

    <script data-page-node-id="miOWg9DFGIoV4Ee77VWsaH" data-pnid-children="dFTIwuY0oVvlUIGB3qXpAx">
      ;(async function () {
        const api = window.dshDesktop
        const overlay = document.getElementById('overlay')
        const overlayText = document.getElementById('overlayText')
        const badge = document.getElementById('shellBadge')
        const meta = document.getElementById('shellMeta')

        if (!api || !api.terminal) {
          overlayText.innerHTML = '<span class="err">桥接不可用</span><br>preload 未加载。'
          return
        }

        let info
        try {
          info = await api.terminal.available()
        } catch (err) {
          overlayText.innerHTML = '<span class="err">无法查询终端状态</span><br>' + String(err)
          return
        }

        if (!info.available) {
          overlayText.innerHTML =
            '<span class="err">终端不可用</span><br>' +
            (info.reason || 'node-pty 未加载') +
            '<br><br>请重新安装应用，或确认 node-pty 原生模块编译成功。'
          return
        }

        const shell = info.shell || {}
        badge.textContent = shell.label || '终端'
        meta.innerHTML =
          (shell.version ? `版本 <code>${shell.version}</code> · ` : '') +
          `路径 <code>${shell.path || '未知'}</code>`

        const term = new Terminal({
          fontFamily: 'Consolas, "Courier New", monospace',
          fontSize: 13,
          cursorBlink: true,
          convertEol: true,
          theme: {
            background: '#0d0d0d',
            foreground: '#d8dee9',
            cursor: '#4d7cfe',
            selectionBackground: 'rgba(77,124,254,0.3)'
          }
        })

        const fitAddon = new FitAddon.FitAddon()
        term.loadAddon(fitAddon)
        try {
          term.loadAddon(new WebLinksAddon.WebLinksAddon())
        } catch (e) {
          /* web-links is optional */
        }

        term.open(document.getElementById('terminal'))

        const sessionId = 'term-' + Date.now()

        const ro = new ResizeObserver(() => {
          try {
            fitAddon.fit()
            api.terminal.resize(sessionId, term.cols, term.rows)
          } catch (e) {
            /* ignore transient resize failures */
          }
        })
        ro.observe(document.getElementById('terminal'))

        term.onData((data) => api.terminal.write(sessionId, data))

        api.terminal.onData(sessionId, (data) => term.write(data))
        api.terminal.onExit(sessionId, (info2) => {
          const code = info2 && info2.code !== undefined ? info2.code : '?'
          term.writeln(`\r\n[进程已退出，代码 ${code}]`)
        })

        try {
          fitAddon.fit()
          const created = await api.terminal.create(sessionId, term.cols, term.rows)
          overlay.classList.add('hidden')
          term.focus()

          if (created && created.shell) {
            badge.textContent = created.shell.label || badge.textContent
          }
        } catch (err) {
          overlayText.innerHTML =
            '<span class="err">终端启动失败</span><br>' + (err && err.message ? err.message : String(err))
        }

        window.addEventListener('beforeunload', () => {
          try {
            api.terminal.dispose(sessionId)
          } catch (e) {
            /* ignore */
          }
        })
      })()
    </script>
  </body>
